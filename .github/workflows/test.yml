name: Paco tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon is exercised locally; CI also validates the Intel build.
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r server/requirements.lock
      - run: python -m unittest discover -v
      - run: python eval_workweek.py
      - run: node --check web/app.js
      - run: node --check web/setup.js
      - run: node --check web/meetings.js
      - run: node --check web/workspace.js
      - run: node --check web/embedded.js
      - run: node --check extensions/meet-speakers/content.js
      - run: node --check extensions/meet-speakers/worker.js
      - run: node --check extensions/meet-speakers/popup.js
      - run: node extensions/meet-speakers/test-content.cjs
      - if: runner.os == 'macOS'
        run: python build_app.py
      - if: runner.os == 'macOS'
        run: |
          xcrun clang -mmacosx-version-min=14.2 -fobjc-arc -fmodules native/MeetingSpeakers.m native/MeetingSpeakersTests.m -framework Cocoa -framework ApplicationServices -o /tmp/paco-speaker-tests
          /tmp/paco-speaker-tests
